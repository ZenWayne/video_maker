# nginx serving the built Vite SPA + proxying /api/ to the `backend` Service
# (see frontend-vite/nginx.conf, baked into the image at build time).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-maker-frontend
  namespace: video-maker
  labels:
    app: video-maker
    component: frontend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: video-maker
      component: frontend
  template:
    metadata:
      labels:
        app: video-maker
        component: frontend
    spec:
      restartPolicy: Always
      nodeSelector:
        kubernetes.io/hostname: vm-0-8-ubuntu
      imagePullSecrets:
        - name: tcr-pull-secret
      containers:
        - name: frontend
          image: ccr.ccs.tencentyun.com/tarrot/video-maker-frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          # frontend-vite/nginx.conf has no dedicated health path; `/` serves
          # index.html via the SPA fallback and is always 200 once nginx is up.
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "200m"
              memory: "64Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: video-maker-frontend
  namespace: video-maker
  labels:
    app: video-maker
    component: frontend
spec:
  type: ClusterIP
  selector:
    app: video-maker
    component: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
