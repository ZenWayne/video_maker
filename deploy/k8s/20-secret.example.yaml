# Template for `video-maker-secrets`. Copy to 20-secret.yaml, fill in real
# values (from deploy/secrets.yml, same keys), apply, then delete the filled
# file. DO NOT commit the filled file.
#
# Quickest path (values already live in this worktree's deploy/secrets.yml):
#   cp 20-secret.example.yaml 20-secret.yaml
#   $EDITOR 20-secret.yaml   # paste in the real values
#   kubectl apply -f 20-secret.yaml
#   shred -u 20-secret.yaml  # or just delete it
#
# The GCP service-account JSON (for Vertex AI: Gemini / Veo / CC / TF) is
# NOT included here — it's a whole file, not a flat string, so it's created
# imperatively as its own secret. See README.md "Deploy" step 3b.
#
# stringData (not `data`) is used deliberately: kubectl accepts plaintext
# here and base64-encodes it for you, so placeholder values below don't need
# to be valid base64 for `kubectl apply --dry-run=client` to pass.
apiVersion: v1
kind: Secret
metadata:
  name: video-maker-secrets
  namespace: video-maker
  labels:
    app: video-maker
type: Opaque
stringData:
  # --- Gemini API key (Google AI Studio) — not used when VIDEO_PROVIDER/LLM
  #     calls go through Vertex AI + the GCP SA, but the app reads this at
  #     startup so keep it non-empty to avoid surprises. ---
  GEMINI_API_KEY: "YOUR_GEMINI_API_KEY_HERE"

  # --- Veo video generation (used only if VIDEO_PROVIDER=kie proxy path) ---
  VEO_API_KEY: "YOUR_VEO_API_KEY_HERE"

  # --- kie.ai (used only when VIDEO_PROVIDER=kie) ---
  KIE_API_KEY: "YOUR_KIE_API_KEY_HERE"

  # --- DeepSeek API key ---
  DEEPSEEK_API_KEY: "YOUR_DEEPSEEK_API_KEY_HERE"

  # --- Langfuse (LLM observability) project keys ---
  LANGFUSE_PUBLIC_KEY: "YOUR_LANGFUSE_PUBLIC_KEY_HERE"
  LANGFUSE_SECRET_KEY: "YOUR_LANGFUSE_SECRET_KEY_HERE"

  # --- Tencent Cloud COS (object storage) — static SecretId/SecretKey.
  #     Get from https://console.cloud.tencent.com/cam/capi (use a
  #     sub-account, not root). ---
  COS_SECRET_ID: "AKIDxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
  COS_SECRET_KEY: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
