# Dev backend stack — start with:
#   make config    (write deploy/config.yml → deploy/config.env)
#   make secrets   (write deploy/secrets.yml → deploy/secrets/)
#   make dev       (runs both automatically, then starts all containers)

# 数据库连接分量 —— 三个 Python 服务共用这一处定义。
# 迁移前这里是 3 份写死的 DATABASE_URL，改一处漏两处是常态。
x-db-env: &db-env
  POSTGRES_HOST: video-maker-postgres-dev
  POSTGRES_PORT: "5432"
  POSTGRES_DB: videomaker
  POSTGRES_USER: videomaker
  POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password

services:
  redis:
    image: redis:7-alpine
    container_name: video-maker-redis-dev
    ports:
      - "6381:6379"
    restart: unless-stopped

  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: video-maker-postgres-dev
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: videomaker
      POSTGRES_DB: videomaker
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - app-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U videomaker -d videomaker"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: video-maker-backend-dev
    container_name: video-maker-backend-dev
    ports:
      - "8002:8002"
    volumes:
      - ../backend:/app:z
      - uv-cache:/root/.cache/uv
      - backend-venv:/app/.venv
      - app-data:/app/data          # shared DB across worktrees (compose project "deploy")
      - app-storage:/app/storage     # shared media storage across worktrees
      - ./secrets/gcp-sa.json:/run/secrets/gcp-sa.json:ro,z
    secrets:
      - gemini_api_key
      - veo_api_key
      - kie_api_key
      - deepseek_api_key
      - langfuse_public_key
      - langfuse_secret_key
      - cos_secret_id
      - cos_secret_key
      - postgres_password
    env_file:
      - path: ./config.env
        required: true
    working_dir: /app
    environment:
      <<: *db-env
      REDIS_URL: redis://video-maker-redis-dev:6379
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp-sa.json
      HTTP_PROXY: http://host.containers.internal:10809
      HTTPS_PROXY: http://host.containers.internal:10809
      http_proxy: http://host.containers.internal:10809
      https_proxy: http://host.containers.internal:10809
      NO_PROXY: localhost,127.0.0.1,host.containers.internal,.myqcloud.com
      no_proxy: localhost,127.0.0.1,host.containers.internal,.myqcloud.com
    command: >
      sh -c "export GEMINI_API_KEY=$(cat /run/secrets/gemini_api_key) &&
             export VEO_API_KEY=$(cat /run/secrets/veo_api_key) &&
             export KIE_API_KEY=$(cat /run/secrets/kie_api_key) &&
             export DEEPSEEK_API_KEY=$(cat /run/secrets/deepseek_api_key) &&
             export LANGFUSE_PUBLIC_KEY=$(cat /run/secrets/langfuse_public_key) &&
             export LANGFUSE_SECRET_KEY=$(cat /run/secrets/langfuse_secret_key) &&
             export COS_SECRET_ID=$(cat /run/secrets/cos_secret_id) &&
             export COS_SECRET_KEY=$(cat /run/secrets/cos_secret_key) &&
             uv run --project . alembic upgrade head &&
             uv run --project . uvicorn app.main:app --host 0.0.0.0 --port 8002
             --reload --reload-dir /app/app --reload-dir /app/worker"
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: video-maker-worker-dev
    container_name: video-maker-worker-dev
    volumes:
      - ../backend:/app:z
      - uv-cache:/root/.cache/uv
      - worker-venv:/app/.venv      # isolated from backend/mcp's backend-venv — this one gets the `asr` group
      - app-data:/app/data          # shared DB across worktrees (compose project "deploy")
      - app-storage:/app/storage     # shared media storage across worktrees
      - ./secrets/gcp-sa.json:/run/secrets/gcp-sa.json:ro,z
      - whisper-cache:/root/.cache/huggingface   # persists faster-whisper model weights (~3GB for large-v3)
    secrets:
      - gemini_api_key
      - veo_api_key
      - kie_api_key
      - deepseek_api_key
      - langfuse_public_key
      - langfuse_secret_key
      - cos_secret_id
      - cos_secret_key
      - postgres_password
    env_file:
      - path: ./config.env
        required: true
    working_dir: /app
    environment:
      <<: *db-env
      REDIS_URL: redis://video-maker-redis-dev:6379
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp-sa.json
      HTTP_PROXY: http://host.containers.internal:10809
      HTTPS_PROXY: http://host.containers.internal:10809
      http_proxy: http://host.containers.internal:10809
      https_proxy: http://host.containers.internal:10809
      NO_PROXY: localhost,127.0.0.1,host.containers.internal,.myqcloud.com
      no_proxy: localhost,127.0.0.1,host.containers.internal,.myqcloud.com
      HF_HOME: /root/.cache/huggingface
    command: >
      sh -c "export GEMINI_API_KEY=$(cat /run/secrets/gemini_api_key) &&
             export VEO_API_KEY=$(cat /run/secrets/veo_api_key) &&
             export KIE_API_KEY=$(cat /run/secrets/kie_api_key) &&
             export DEEPSEEK_API_KEY=$(cat /run/secrets/deepseek_api_key) &&
             export LANGFUSE_PUBLIC_KEY=$(cat /run/secrets/langfuse_public_key) &&
             export LANGFUSE_SECRET_KEY=$(cat /run/secrets/langfuse_secret_key) &&
             export COS_SECRET_ID=$(cat /run/secrets/cos_secret_id) &&
             export COS_SECRET_KEY=$(cat /run/secrets/cos_secret_key) &&
             uv run --project . --group asr python -m arq worker.arq_worker.WorkerSettings"
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped

  vc-worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.vc-worker
    image: video-maker-vc-worker-dev
    container_name: video-maker-vc-worker-dev
    volumes:
      - ../backend:/app:z
      - uv-cache:/root/.cache/uv
      - backend-venv:/app/.venv
      - app-data:/app/data          # shared DB across worktrees (compose project "deploy")
      - app-storage:/app/storage     # shared media storage across worktrees
    secrets:
      - cos_secret_id
      - cos_secret_key
      - postgres_password
    env_file:
      - path: ./config.env
        required: true
    working_dir: /app
    environment:
      <<: *db-env
      REDIS_URL: redis://video-maker-redis-dev:6379
      PYTHONPATH: /usr/local/lib/python3.12/site-packages
      NO_PROXY: localhost,127.0.0.1,host.containers.internal,.myqcloud.com
      no_proxy: localhost,127.0.0.1,host.containers.internal,.myqcloud.com
    command: >
      sh -c "export COS_SECRET_ID=$(cat /run/secrets/cos_secret_id) &&
             export COS_SECRET_KEY=$(cat /run/secrets/cos_secret_key) &&
             uv run --project . python -m arq worker.vc_arq_worker.VcWorkerSettings"
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped

  mcp:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: video-maker-worker-dev
    container_name: video-maker-mcp-dev
    ports:
      - "8765:8765"
    volumes:
      - ../backend:/app:z
      - uv-cache:/root/.cache/uv
      - backend-venv:/app/.venv
    env_file:
      - path: ./config.env
        required: true
    working_dir: /app
    environment:
      BACKEND_BASE_URL: http://video-maker-backend-dev:8002
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8765"
      HTTP_PROXY: http://host.containers.internal:10809
      HTTPS_PROXY: http://host.containers.internal:10809
      http_proxy: http://host.containers.internal:10809
      https_proxy: http://host.containers.internal:10809
      # internal backend must bypass the proxy (proxy can't resolve container names)
      NO_PROXY: video-maker-backend-dev,localhost,127.0.0.1
      no_proxy: video-maker-backend-dev,localhost,127.0.0.1
    # host.containers.internal does not route to the host under this network; pin it.
    extra_hosts:
      - "host.containers.internal:100.121.231.24"
    command: >
      uv run --project . python -m mcp_server.server
    depends_on:
      - backend
    restart: unless-stopped

  playwright:
    image: mcr.microsoft.com/playwright:v1.41.0-jammy
    container_name: video-maker-playwright
    network_mode: host
    command: npx playwright@1.41.0 run-server --port 3003 --host 0.0.0.0
    restart: unless-stopped

  frontend:
    image: node:20-slim
    container_name: video-maker-frontend-dev
    ports:
      - "4000:4000"
    volumes:
      - ../frontend-vite:/app:z
    working_dir: /app
    environment:
      BACKEND_URL: http://video-maker-backend-dev:8002
    # node_modules must exist on host before starting (run: cd frontend-vite && npm install)
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  uv-cache:
  backend-venv:  # isolated venv for containers (avoids conflict with host uv)
  worker-venv:   # separate venv for worker — has the `asr` group installed, unlike backend/mcp
  app-data:      # shared sqlite DB — same volume for every worktree's stack (project "deploy")
  app-storage:   # shared shot media — same volume for every worktree's stack
  whisper-cache: # faster-whisper model weights (HF_HOME) — avoids re-downloading ~3GB on container recreate
  app-pgdata:    # PostgreSQL 数据目录，与 app-data(sqlite) 并存以便回滚

secrets:
  gemini_api_key:
    file: ./secrets/gemini_api_key  # written by: make secrets
  veo_api_key:
    file: ./secrets/veo_api_key  # written by: make secrets
  kie_api_key:
    file: ./secrets/kie_api_key  # written by: make secrets
  deepseek_api_key:
    file: ./secrets/deepseek_api_key  # written by: make secrets
  langfuse_public_key:
    file: ./secrets/langfuse_public_key  # written by: make secrets
  langfuse_secret_key:
    file: ./secrets/langfuse_secret_key  # written by: make secrets
  cos_secret_id:
    file: ./secrets/cos_secret_id  # written by: make secrets
  cos_secret_key:
    file: ./secrets/cos_secret_key  # written by: make secrets
  postgres_password:
    file: ./secrets/postgres_password  # written by: make secrets
