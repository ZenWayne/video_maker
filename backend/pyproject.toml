[project]
name = "video-maker-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.19",
    "arq>=0.25",
    "redis>=5.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "google-genai>=0.3",
    "python-ffmpeg>=2.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.0",
    "python-json-logger>=2.0",
    "openai>=2.31.0",
    "httpx>=0.27",
    "scikit-image>=0.24",
    "langfuse>=3.0",
    "fastmcp>=2.0",
    "cos-python-sdk-v5>=1.9",
    "asyncpg>=0.29",
    "alembic>=1.13",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "coverage>=7.0",
]
# 内容分析（爆款归因）ASR 服务依赖，独立分组，仅 worker 需要。
# 安装：uv sync --group asr  （拉入 faster-whisper 及其传递依赖 ctranslate2 / onnxruntime[Silero VAD] / av）
asr = [
    "faster-whisper>=1.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
