server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Upload size cap. nginx defaults to 1m, which 413s every reference-video
    # upload to POST /api/analyses (and any shot upload via /api/uploads) —
    # neither the frontend nor the backend defines a limit of its own, so this
    # default was the effective one and it made the content-analysis feature
    # unusable through this proxy. `files` is a list, so the cap applies to
    # the whole multipart request, not per file.
    client_max_body_size 512m;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # SSE progress streams — must come before `location /api/` (regex
    # locations are evaluated first, and win over prefix locations).
    #
    # There are exactly two, both EventSource-driven:
    #   GET /api/projects/{id}/stream   (src/lib/sse.ts)
    #   GET /api/analyses/{id}/stream   (src/lib/analysisSse.ts)
    # They need buffering off, or nginx holds events until its buffer fills
    # and progress never arrives in real time.
    #
    # Why a regex and not `location /api/analyses/`: for a prefix location
    # ending in `/` whose proxy_pass carries a URI, nginx answers a request
    # for the location path WITHOUT the trailing slash with a 301 that adds
    # it. `POST /api/analyses` then became 301 -> /api/analyses/ -> FastAPI
    # 307 (redirect_slashes) -> /api/analyses -> ... an endless loop, and
    # browsers demote a 301'd POST to GET, so creating an analysis was
    # impossible. A regex location performs no such redirect, and proxy_pass
    # without a URI part forwards the original request URI untouched.
    location ~ ^/api/(?:projects|analyses)/[^/]+/stream$ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    # API proxy to backend.
    # The trailing /api/ on proxy_pass is required: every router in
    # backend/app/main.py is mounted with prefix="/api", so the prefix must be
    # preserved, not stripped.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Uploads (POST /api/analyses, /api/uploads) stream the file on to COS
        # inside the request, so the response can take far longer than nginx's
        # 60s default read timeout — that default returned a 504 for a 1.8MB
        # reference video. Give slow upstream media work room to finish.
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # Static assets - long cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
